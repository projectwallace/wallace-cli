# Block dependencies from using non-registry sources (git repos, tarballs)
blockExoticSubdeps: true

# Wait 1 week before allowing newly published packages to be installed,
# except for first-party packages you own
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@projectwallace/*'

# Prevent trust level downgrades compared to previously installed packages
trustPolicy: no-downgrade
# undici-types@6.21.0 (transitive via @types/node): verified tarball integrity
# matches npm registry and maintainers are the legit undici/Node authors. The
# flag is a false positive from provenance adoption happening after this
# version's publish date, not an actual takeover.
trustPolicyExclude:
  - 'undici-types'
